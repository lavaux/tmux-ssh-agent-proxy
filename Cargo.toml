[package]
name = "tmux-ssh-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
rand = "0.8"
nix = { version = "0.28", default-features = false, features = ["process", "fs", "user", "poll", "signal", "term"] }
