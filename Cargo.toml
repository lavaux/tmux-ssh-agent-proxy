[package]
name = "tmux-ssh-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Transparent SSH agent proxy for tmux: each client gets its own agent"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
rand = "0.8"
nix = { version = "0.28", default-features = false, features = ["process", "fs", "user", "poll", "signal", "term", "socket"] }
